---
- name: Prepare
  hosts: all
  gather_facts: true

  pre_tasks:
    # The nested Docker daemon we install below runs inside a container
    # whose own root filesystem is already overlayfs (molecule's docker
    # driver). Recent containerd (2.x, shipped for EL9+/Fedora/newer
    # Ubuntu-Debian) fails to mount overlay-on-overlay in that setup
    # ("failed to mount ... invalid argument"), which only ever shows up
    # in this nested test environment - not on a real (non-containerized)
    # host running traefik_docker. Forcing vfs here avoids that, at the
    # cost of slower image layer handling during tests only.
    - name: Ensure /etc/docker exists
      ansible.builtin.file:
        path: /etc/docker
        state: directory
        mode: "0755"

    - name: Force vfs storage driver for the nested test Docker daemon
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        content: |
          {
            "storage-driver": "vfs"
          }
        mode: "0644"

    - name: Install python3-docker via apt (Debian)
      ansible.builtin.apt:
        name:
          - "python3-docker"
          - "python3-requests"
        state: present
        update_cache: true
      when:
        - ansible_facts['os_family'] == "Debian"

    - name: Install python3-pip (RedHat)
      ansible.builtin.package:
        name:
          - "python3-pip"
        state: present
      when:
        - ansible_facts['os_family'] == "RedHat"

    # ansible.builtin.pip needs "packaging" importable on the target BEFORE
    # it runs at all (it's used internally to compare versions), so it can't
    # be installed via the same pip task that also installs docker - that's
    # a chicken-and-egg problem. Bootstrapping it with a raw pip invocation
    # first sidesteps the module's own dependency on itself.
    - name: Bootstrap packaging for ansible's pip module (RedHat)
      ansible.builtin.command: python3 -m pip install packaging
      changed_when: true
      when:
        - ansible_facts['os_family'] == "RedHat"

    - name: Install docker via pip (RedHat)
      ansible.builtin.pip:
        name: "docker"
        state: present
      when:
        - ansible_facts['os_family'] == "RedHat"

  roles:
    - role: mullholland.docker
    - role: mullholland.repository_epel
